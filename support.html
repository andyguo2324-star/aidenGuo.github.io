<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iMark 技术支持 | iMark Support</title>
<style>
  :root {
    --accent: #5b7cfa;
    --accent-2: #9a6cff;
    --accent-soft: rgba(91, 124, 250, .12);
    --bg: #f6f7fb;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #6e6e73;
    --border: rgba(0,0,0,.06);
    --shadow: 0 8px 28px rgba(31, 38, 135, .08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 760px; margin: 0 auto; padding: 0 24px; }

  /* ===== Hero ===== */
  header {
    position: relative;
    background: linear-gradient(135deg, #5b7cfa 0%, #7a5cff 55%, #a04cff 100%);
    color: #fff;
    padding: 76px 0 88px;
    text-align: center;
    overflow: hidden;
  }
  header::before {
    content: "";
    position: absolute;
    top: -120px; left: -80px;
    width: 340px; height: 340px;
    border-radius: 50%;
    background: rgba(255,255,255,.10);
    filter: blur(8px);
  }
  header::after {
    content: "";
    position: absolute;
    bottom: -160px; right: -60px;
    width: 420px; height: 420px;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
    filter: blur(10px);
  }
  header > * { position: relative; z-index: 1; }
  header .logo {
    width: 92px; height: 92px; border-radius: 24px;
    background: rgba(255,255,255,.16);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.28);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 22px;
    box-shadow: 0 18px 40px rgba(20, 20, 80, .30);
    animation: float 4s ease-in-out infinite;
    overflow: hidden;
  }
  header .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  header h1 { font-size: 34px; font-weight: 800; letter-spacing: .5px; text-shadow: 0 2px 12px rgba(0,0,0,.12); }
  header .tagline { margin-top: 10px; font-size: 15px; opacity: .94; font-weight: 500; }
  header .badge-row { margin-top: 22px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  header .badge {
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.30);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 600;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  /* ===== Language switch ===== */
  .lang-switch {
    position: absolute;
    top: 20px; right: 24px;
    z-index: 3;
    display: flex;
    gap: 2px;
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 999px;
    padding: 4px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .lang-switch button {
    border: none;
    background: transparent;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    opacity: .72;
    transition: opacity .15s ease, background .15s ease;
  }
  .lang-switch button.active { background: rgba(255,255,255,.26); opacity: 1; }
  @media (max-width: 420px) {
    .lang-switch { top: 14px; right: 14px; }
  }

  main { padding: 0 0 70px; }

  /* ===== Cards ===== */
  section {
    background: var(--card);
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  section:hover { transform: translateY(-2px); box-shadow: 0 12px 34px rgba(31, 38, 135, .12); }

  .section-title {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px;
  }
  .section-title .icon {
    width: 40px; height: 40px; flex: 0 0 40px;
    border-radius: 12px;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .section-title h2 { font-size: 19px; font-weight: 800; }
  .section-title .sub { font-size: 12.5px; color: var(--muted); font-weight: 500; }

  h3 { font-size: 15.5px; font-weight: 700; margin: 20px 0 6px; display: flex; align-items: center; gap: 8px; }
  h3 .dot { width: 7px; height: 7px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent-2)); flex: 0 0 7px; }
  p { color: var(--text); margin-bottom: 10px; }
  .muted { color: var(--muted); }
  .privacy-policy { font-size: 14px; color: var(--muted); }
  .privacy-policy h3 { color: var(--text); }
  .privacy-policy p { color: var(--muted); margin-bottom: 10px; }
  .privacy-policy ul { padding-left: 20px; margin-bottom: 10px; }
  .privacy-policy a { color: var(--accent); }

  /* ===== Contact ===== */
  .contact-inner {
    background: linear-gradient(135deg, var(--accent-soft), rgba(154,108,255,.10));
    border-radius: 16px;
    padding: 22px 24px;
    margin-top: 6px;
    border: 1px dashed var(--accent);
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff !important;
    padding: 13px 28px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 15px;
    box-shadow: 0 10px 24px rgba(91,124,250,.35);
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    margin-top: 14px;
    text-decoration: none;
    max-width: 100%;
    text-align: center;
    white-space: normal;
    word-break: break-all;
    line-height: 1.4;
  }
  .btn:hover { text-decoration: none; transform: translateY(-2px); box-shadow: 0 14px 30px rgba(91,124,250,.45); filter: brightness(1.05); }

  /* ===== Features ===== */
  .feature-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 6px; }
  .feature {
    display: flex; gap: 14px;
    padding: 16px 18px;
    border-radius: 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    align-items: flex-start;
  }
  .feature .f-icon {
    width: 42px; height: 42px; flex: 0 0 42px;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: 0 4px 12px rgba(31,38,135,.06);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .feature h3 { margin: 0 0 4px; font-size: 15px; }
  .feature p { margin: 0; font-size: 13.5px; }

  /* ===== FAQ ===== */
  .faq-item {
    border-bottom: 1px solid var(--border);
    padding: 18px 4px;
  }
  .faq-item:last-child { border-bottom: none; }
  .faq-item h3 { margin: 0 0 6px; font-size: 15px; }
  .faq-item h3 .q-tag {
    font-size: 12px; font-weight: 800;
    background: var(--accent-soft); color: var(--accent);
    padding: 3px 10px; border-radius: 999px;
    margin-right: 4px;
  }
  .faq-item p { margin: 0; font-size: 14px; }

  /* ===== App info ===== */
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 6px; }
  .info-cell {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
  }
  .info-cell .k { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
  .info-cell .v { font-size: 15px; font-weight: 700; margin-top: 3px; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 30px 0 56px;
  }
  footer .footer-logo {
    font-size: 18px; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }

  @media (max-width: 560px) {
    .info-grid { grid-template-columns: 1fr; }
    header { padding: 56px 0 72px; }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1016;
      --card: #1a1c26;
      --text: #f2f3f7;
      --muted: #9aa0b5;
      --border: rgba(255,255,255,.08);
      --accent-soft: rgba(91,124,250,.16);
      --shadow: 0 8px 28px rgba(0,0,0,.45);
    }
    .feature, .info-cell { background: #13151f; }
    .feature .f-icon { background: #1f2231; }
    .contact-inner { border-color: var(--accent); }
  }
</style>
</head>

      <h3><span class="dot"></span><span data-zh="我们如何收集和使用您的个人信息" data-en="How We Collect and Use Your Personal Information"></span></h3>

      <p data-zh="我们可能会根据法律法规规定，或按政府主管部门的强制性要求，对外共享您的个人信息。 在符合法律法规的前提下，当我们收到上述披露信息的请求时，我们会要求必须出具与之相应的法律文件，如传票或调查函。 我们坚信，对于要求我们提供的信息，应该在法律允许的范围内尽可能保持透明。" data-en="We may share your personal information externally in accordance with laws and regulations, or per mandatory requirements from government authorities. When we receive such disclosure requests, we will require corresponding legal documents, such as subpoenas or investigation letters. We believe that information requested from us should be as transparent as possible within the scope permitted by law."></p>

<script>
(function () {
  var LANG_KEY = 'iMark-lang';

  function detectLang() {
    var params = new URLSearchParams(window.location.search);
    var fromUrl = params.get('lang');
    if (fromUrl === 'zh' || fromUrl === 'en') return fromUrl;
    try {
      var stored = localStorage.getItem(LANG_KEY);
      if (stored === 'zh' || stored === 'en') return stored;
    } catch (e) {}
    var nav = (navigator.language || '').toLowerCase();
    return nav.indexOf('zh') === 0 ? 'zh' : 'en';
  }

  function applyLang(lang) {
    var attr = lang === 'zh' ? 'data-zh' : 'data-en';
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : 'en';
    document.title = lang === 'zh' ? 'iMark 技术支持' : 'iMark Support';
    document.querySelectorAll('[' + attr + ']').forEach(function (el) {
      el.innerHTML = el.getAttribute(attr);
    });
    document.querySelectorAll('.lang-switch button').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
    });
    var url = new URL(window.location.href);
    if (lang === 'en') {
      url.searchParams.set('lang', 'en');
    } else {
      url.searchParams.delete('lang');
    }
    history.replaceState(null, '', url.toString());
    try {
      localStorage.setItem(LANG_KEY, lang);
    } catch (e) {}
  }

  document.addEventListener('DOMContentLoaded', function () {
    applyLang(detectLang());
    document.querySelectorAll('.lang-switch button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        applyLang(btn.getAttribute('data-lang'));
      });
    });
  });
})();
</script>
